name: Bug report
description: Something is broken in the component library.
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more concrete the repro,
        the faster we can fix it.

  - type: input
    id: version
    attributes:
      label: Version
      description: The npm version you are using.
      placeholder: '0.8.2'
    validations:
      required: true

  - type: input
    id: framework
    attributes:
      label: Framework
      description: Svelte and SvelteKit versions.
      placeholder: 'Svelte 5.x, SvelteKit 2.x'
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Observed vs expected behavior.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal code or component that shows the problem.
      placeholder: |
        ```svelte
        <Button tone="primary">Click</Button>
        ```
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - 'Critical -- app broken'
        - 'Major -- feature broken, no workaround'
        - 'Minor -- workaround exists'
        - 'Cosmetic'
    validations:
      required: true
