allowBuilds:
  esbuild: true
minimumReleaseAgeStrict: true
# Transitive dependencies held below their patched release by the packages that
# pull them in. Each range starts at the first version that clears its advisory.
overrides:
  'brace-expansion@>=2.0.0 <2.1.7': ^2.1.7
  'form-data@>=4.0.0 <4.0.6': ^4.0.6
  'nanoid@<3.3.18': ^3.3.18
  'postcss@<8.5.23': ^8.5.23
  'source-map-js@<1.2.2': ^1.2.2
